# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Enforce workflow-based Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          code=$(curl -sS -L -o /tmp/meridian-pages-update.json -w '%{http_code}' \
            -X PUT -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d '{"build_type":"workflow"}')
          echo "Pages source update HTTP: $code"
          if [ "$code" != "204" ]; then
            echo "::warning::Unable to confirm workflow-only publishing source; check Settings > Pages for competing branch builds"
            head -c 1000 /tmp/meridian-pages-update.json || true
            echo
          fi
          read_code=$(curl -sS -L -o /tmp/meridian-pages-read.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" "$api")
          echo "Pages source read HTTP: $read_code"
          if [ "$read_code" = "200" ]; then
            python3 -c "import json; x=json.load(open('/tmp/meridian-pages-read.json')); print('Pages build_type:',x.get('build_type')); print('Pages official URL:',x.get('html_url'))"
          fi
      - name: Prepare curated public-only Pages artifact
        run: |
          set -eu
          mkdir -p _site/nano-voice-lab _site/deployment-control-room _site/callback-committee _site/gary-knows-stats
          cp gayson-control-center/index.html _site/index.html
          cp nano-voice-lab/index.html _site/nano-voice-lab/index.html
          cp deployment-control-room/index.html _site/deployment-control-room/index.html
          cp sites/callback-committee/index.html _site/callback-committee/index.html
          cp workspaces/gary-knows-stats-site/index.html _site/gary-knows-stats/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          if grep -RE 'THE_BANQUET_EMBER|3-D_Evening_Awareness|3-D_Timing_And_Friday' _site --include='*.html'; then
            echo "Known private filename marker found; refusing publication"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the curated public static artifact, never repository internals
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify production content is current
        env:
          MERIDIAN_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          echo "Checking published root content at $MERIDIAN_PAGES_URL"
          ready=0
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$MERIDIAN_PAGES_URL" | grep -q "GAYSON Industries"; then
              ready=1
              echo "GAYSON root content verified at attempt $attempt"
              break
            fi
            echo "Root is not yet the intended GAYSON homepage (attempt $attempt)"
            sleep 8
          done
          [ "$ready" -eq 1 ] || { echo "::error::Published root is wrong or unreachable"; exit 1; }
      - name: Install headless browser smoke test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run production browser tests (desktop and mobile)
        env:
          MERIDIAN_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/production-smoke.mjs

