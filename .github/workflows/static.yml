# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare curated public-only Pages artifact
        run: |
          set -eu
          mkdir -p _site/nano-voice-lab _site/deployment-control-room _site/callback-committee _site/gary-knows-stats
          cp gayson-control-center/index.html _site/index.html
          cp nano-voice-lab/index.html _site/nano-voice-lab/index.html
          cp deployment-control-room/index.html _site/deployment-control-room/index.html
          cp sites/callback-committee/index.html _site/callback-committee/index.html
          cp workspaces/gary-knows-stats-site/index.html _site/gary-knows-stats/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          if grep -RE 'THE_BANQUET_EMBER|3-D_Evening_Awareness|3-D_Timing_And_Friday' _site --include='*.html'; then
            echo "Known private filename marker found; refusing publication"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the curated public static artifact, never repository internals
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
